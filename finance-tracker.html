<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Finance Tracker</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Segoe UI;
background:#f4f6fb;
}

.login-bg{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#667eea,#764ba2);
}

.login-card{
width:380px;
padding:40px;
border-radius:18px;
background:white;
box-shadow:0 20px 40px rgba(0,0,0,0.2);
}

.link{
font-size:14px;
color:#667eea;
cursor:pointer;
}

.navbar{
background:linear-gradient(135deg,#667eea,#764ba2);
}

.card{
border:none;
border-radius:12px;
box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

.stat{
font-size:26px;
font-weight:bold;
}

.transaction{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px;
border-bottom:1px solid #eee;
}

small{
color:#666;
}

</style>

</head>

<body>


<!-- LOGIN -->

<div class="login-bg" id="loginPage">

<div class="login-card">

<h4 class="text-center mb-4">💰 Finance Tracker</h4>

<input class="form-control mb-3" id="mobile" placeholder="Enter Mobile Number">

<button class="btn btn-primary w-100 mb-3" onclick="sendOTP()">Send OTP</button>

<input class="form-control mb-3" id="otp" placeholder="Enter OTP">

<button class="btn btn-success w-100 mb-3" onclick="verifyOTP()">Verify OTP</button>

<div class="d-flex justify-content-between">

<span class="link" onclick="createAccount()">Create Account</span>
<span class="link" onclick="forgotPassword()">Forgot Password?</span>

</div>

</div>

</div>



<!-- APP -->

<div id="app" style="display:none">

<nav class="navbar navbar-dark">

<div class="container">

<span class="navbar-brand">Finance Tracker</span>

<div>

<span class="text-white me-3" id="navBalance">₹0</span>

<button class="btn btn-light btn-sm" onclick="logout()">Logout</button>

</div>

</div>

</nav>



<div class="container mt-4">

<div class="row text-center">

<div class="col-md-3">
<div class="card p-3">
<h6>Total Income</h6>
<div class="stat text-success" id="income">₹0</div>
</div>
</div>

<div class="col-md-3">
<div class="card p-3">
<h6>Total Expense</h6>
<div class="stat text-danger" id="expense">₹0</div>
</div>
</div>

<div class="col-md-3">
<div class="card p-3">
<h6>Balance</h6>
<div class="stat" id="balance">₹0</div>
</div>
</div>

<div class="col-md-3">
<div class="card p-3">
<h6>Transactions</h6>
<div class="stat" id="count">0</div>
</div>
</div>

</div>


<div class="row mt-4">

<div class="col-md-8">

<div class="card p-3">

<div class="d-flex justify-content-between mb-3">

<h5>Expense Chart</h5>

<button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modal">
Add Transaction
</button>

</div>

<canvas id="chart"></canvas>

<hr>

<h6>Income vs Expense</h6>

<canvas id="chart2"></canvas>

</div>

</div>


<div class="col-md-4">

<div class="card p-3">

<h5>Transactions</h5>

<input class="form-control mb-2" placeholder="Search..." onkeyup="searchTransaction(this.value)">

<div id="list"></div>

</div>

</div>

</div>

</div>

</div>



<!-- MODAL -->

<div class="modal fade" id="modal">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">
<h5>Add Transaction</h5>
</div>

<div class="modal-body">

<input class="form-control mb-2" id="desc" placeholder="Description">

<input class="form-control mb-2" id="amount" type="number" placeholder="Amount">

<input class="form-control mb-2" id="date" type="date">

<select class="form-select mb-2" id="type">

<option value="income">Income</option>
<option value="expense">Expense</option>

</select>

<select class="form-select" id="category">
  <option selected disabled>Select Category</option>
  <option value="Food">Food</option>
  <option value="Groceries">Groceries</option>
  <option value="Travel">Travel</option>
  <option value="Fuel">Fuel</option>
  <option value="Shopping">Shopping</option>
  <option value="Bills">Bills</option>
  <option value="Rent">Rent</option>
  <option value="Mobile Recharge">Mobile Recharge</option>
  <option value="Internet">Internet</option>
  <option value="Entertainment">Entertainment</option>
  <option value="Health">Health</option>
  <option value="Education">Education</option>
  <option value="Savings">Savings</option>
  <option value="Investment">Investment</option>
  <option value="Insurance">Insurance</option>
  <option value="Loan">Loan</option>
  <option value="Gift">Gift</option>
  <option value="Other">Other</option>
</select>

</div>

<div class="modal-footer">

<button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>

<button class="btn btn-primary" onclick="addTransaction()">Add</button>

</div>

</div>

</div>

</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


<script>

/* LOGIN */

let generatedOTP=""

function sendOTP(){

let mobile=document.getElementById("mobile").value

if(mobile.length!=10){
alert("Enter valid mobile number")
return
}

generatedOTP=Math.floor(100000 + Math.random()*900000)

alert("Demo OTP: "+generatedOTP)

}

function verifyOTP(){

let otp=document.getElementById("otp").value

if(otp==generatedOTP){

localStorage.setItem("loggedUser","user")

showApp()

}else{

alert("Invalid OTP")

}

}

function createAccount(){
alert("Account will be created after OTP verification.")
}

function forgotPassword(){
alert("Use OTP to login again.")
}

function logout(){
localStorage.removeItem("loggedUser")
location.reload()
}

function showApp(){
document.getElementById("loginPage").style.display="none"
document.getElementById("app").style.display="block"
updateDashboard()
}



/* DATA */

let transactions=JSON.parse(localStorage.getItem("transactions"))||[]

let chart
let chart2


function initCharts(){

chart=new Chart(document.getElementById("chart"),{

type:"doughnut",

data:{
labels:["Food","Travel","Shopping","Bills"],
datasets:[{
data:[0,0,0,0],
backgroundColor:["#667eea","#764ba2","#f093fb","#4facfe"]
}]
}

})

chart2=new Chart(document.getElementById("chart2"),{

type:"bar",

data:{
labels:["Income","Expense"],
datasets:[{
label:"Finance",
data:[0,0],
backgroundColor:["#28a745","#dc3545"]
}]
}

})

}



/* ADD */

function addTransaction(){

let desc=document.getElementById("desc").value.trim()
let amount=Number(document.getElementById("amount").value)
let date=document.getElementById("date").value
let type=document.getElementById("type").value
let category=document.getElementById("category").value

if(!desc||!amount||!date){
alert("Enter all fields")
return
}

let t={
id:Date.now(),
desc,
amount,
type,
category,
date,
time:new Date().toLocaleTimeString()
}

transactions.push(t)

localStorage.setItem("transactions",JSON.stringify(transactions))

updateDashboard()

bootstrap.Modal.getInstance(document.getElementById("modal")).hide()

}



/* EDIT */

function editTransaction(id){

let t=transactions.find(x=>x.id===id)

let newDesc=prompt("Edit description",t.desc)
let newAmount=prompt("Edit amount",t.amount)

if(newDesc && newAmount){

t.desc=newDesc
t.amount=Number(newAmount)

localStorage.setItem("transactions",JSON.stringify(transactions))

updateDashboard()

}

}



/* DELETE */

function deleteTransaction(id){

transactions=transactions.filter(t=>t.id!==id)

localStorage.setItem("transactions",JSON.stringify(transactions))

updateDashboard()

}



/* SEARCH */

function searchTransaction(text){

text=text.toLowerCase()

let filtered=transactions.filter(t=>t.desc.toLowerCase().includes(text))

renderList(filtered)

}



/* LIST */

function renderList(data){

let list=document.getElementById("list")

list.innerHTML=""

data.forEach(t=>{

list.innerHTML+=`

<div class="transaction">

<div>

<b>${t.desc}</b><br>

<small>${t.category} | ${t.date} ${t.time}</small>

</div>

<div>

<span class="${t.type==="income"?"text-success":"text-danger"}">

₹${t.amount}

</span>

<button class="btn btn-sm btn-outline-primary ms-1" onclick="editTransaction(${t.id})">Edit</button>

<button class="btn btn-sm btn-outline-danger ms-1" onclick="deleteTransaction(${t.id})">Delete</button>

</div>

</div>

`

})

}



/* DASHBOARD */

function updateDashboard(){

let income=0
let expense=0

let food=0
let travel=0
let shopping=0
let bills=0

transactions.forEach(t=>{

if(t.type==="income") income+=t.amount
else expense+=t.amount

if(t.category==="Food") food+=t.amount
if(t.category==="Travel") travel+=t.amount
if(t.category==="Shopping") shopping+=t.amount
if(t.category==="Bills") bills+=t.amount

})

let balance=income-expense

document.getElementById("income").innerText="₹"+income
document.getElementById("expense").innerText="₹"+expense
document.getElementById("balance").innerText="₹"+balance
document.getElementById("navBalance").innerText="₹"+balance
document.getElementById("count").innerText=transactions.length

chart.data.datasets[0].data=[food,travel,shopping,bills]
chart.update()

chart2.data.datasets[0].data=[income,expense]
chart2.update()

renderList(transactions)

}



/* AUTO LOGIN */

window.onload=function(){

initCharts()

let user=localStorage.getItem("loggedUser")

if(user){
showApp()
}

}

</script>

</body>
</html>
